version: 2

# Kiểm tra các trường định danh thiết yếu của mart.
models:
  - name: fct_weather_daily
    description: One typed analytical weather row per city and observation date.
    columns:
      - name: city_key
        tests:
          - not_null
      - name: observation_date
        tests:
          - not_null
      - name: city_name
        tests:
          - not_null
      - name: mean_temperature_c
        tests:
          - not_null
      - name: precipitation_mm
        tests:
          - not_null
      - name: max_wind_speed_kmh
        tests:
          - not_null
