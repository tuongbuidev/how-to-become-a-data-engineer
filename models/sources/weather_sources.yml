version: 2

# Khai báo bảng raw PostgreSQL để model dbt tham chiếu bằng source().
sources:
  - name: weather
    schema: public
    tables:
      - name: raw_weather
        description: Raw Open-Meteo payloads loaded by the Python ingestion pipeline.
        columns:
          - name: city_key
            description: Stable city identifier from config/cities.json.
          - name: observation_date
            description: Date requested from the Open-Meteo archive API.
